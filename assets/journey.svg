<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Learning journey">
  <rect width="1200" height="200" fill="#05070D"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="45" font-size="12" fill="#C0C6D0" letter-spacing="6">LEARNING JOURNEY</text>
    <line x1="60" y1="120" x2="1140" y2="120" stroke="#2A3142" stroke-width="2"/>
    <g transform="translate(120,120)">
      <circle r="8" fill="#00D9FF"/><text y="-20" font-size="13" fill="#F8F5EF" text-anchor="middle" font-weight="700">Fundamentals</text>
      <text y="30" font-size="11" fill="#8A93A6" text-anchor="middle">Linux, networking, OS</text>
    </g>
    <g transform="translate(360,120)">
      <circle r="8" fill="#315BFF"/><text y="-20" font-size="13" fill="#F8F5EF" text-anchor="middle" font-weight="700">SOC</text>
      <text y="30" font-size="11" fill="#8A93A6" text-anchor="middle">Monitoring &amp; triage</text>
    </g>
    <g transform="translate(600,120)">
      <circle r="8" fill="#7357FF"/><text y="-20" font-size="13" fill="#F8F5EF" text-anchor="middle" font-weight="700">Detection</text>
      <text y="30" font-size="11" fill="#8A93A6" text-anchor="middle">Threat analysis</text>
    </g>
    <g transform="translate(840,120)">
      <circle r="8" fill="#D99A38"/><text y="-20" font-size="13" fill="#F8F5EF" text-anchor="middle" font-weight="700">DFIR</text>
      <text y="30" font-size="11" fill="#8A93A6" text-anchor="middle">Incident response</text>
    </g>
    <g transform="translate(1080,120)">
      <circle r="8" fill="#8B1E3F"/><text y="-20" font-size="13" fill="#F8F5EF" text-anchor="middle" font-weight="700">Automation</text>
      <text y="30" font-size="11" fill="#8A93A6" text-anchor="middle">Tooling &amp; workflows</text>
    </g>
  </g>
</svg>