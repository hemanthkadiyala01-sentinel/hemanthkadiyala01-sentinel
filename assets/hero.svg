<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Obsidian Signal hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080F"/>
      <stop offset="60%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#05080F"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8ECF4"/>
      <stop offset="40%" stop-color="#8A93A6"/>
      <stop offset="100%" stop-color="#2A3142"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <!-- atmospheric glow -->
  <ellipse cx="900" cy="210" rx="260" ry="180" fill="url(#glow)"/>
  <!-- crystalline architecture -->
  <g transform="translate(780,60)">
    <polygon points="0,0 120,40 120,260 0,300" fill="url(#chrome)" opacity="0.85"/>
    <polygon points="120,40 260,0 260,260 120,300" fill="#1A2233" opacity="0.9"/>
    <polygon points="0,0 120,40 260,0 140,-40" fill="#E8ECF4" opacity="0.6"/>
    <line x1="120" y1="40" x2="120" y2="300" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="260" y2="0" stroke="#00D4FF" stroke-width="0.5" opacity="0.4"/>
  </g>
  <!-- secondary shard -->
  <g transform="translate(620,120)" opacity="0.5">
    <polygon points="0,0 60,20 60,140 0,160" fill="url(#chrome)"/>
    <polygon points="60,20 130,0 130,140 60,160" fill="#0B1220"/>
  </g>
  <!-- horizontal signal line -->
  <rect x="60" y="300" width="420" height="1" fill="url(#cyan)"/>
  <!-- typography -->
  <text x="60" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#F5F7FA" letter-spacing="2">HEMANTH</text>
  <text x="60" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#F5F7FA" letter-spacing="2">KADIYALA</text>
  <text x="60" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8A93A6" letter-spacing="6">OBSIDIAN / SIGNAL</text>
  <text x="60" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#00D4FF" letter-spacing="3">CYBERSECURITY ENGINEERING</text>
  <!-- corner marks -->
  <g stroke="#00D4FF" stroke-width="1" opacity="0.5">
    <line x1="40" y1="40" x2="80" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="80"/>
    <line x1="1160" y1="380" x2="1120" y2="380"/>
    <line x1="1160" y1="380" x2="1160" y2="340"/>
  </g>
</svg>