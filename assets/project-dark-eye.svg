<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Dark-Eye</title><desc id="desc">Agent workflow architecture visual showing input, planning, tool routing, execution, output, guardrails, and observability.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#03070D"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#131F30"/><stop offset="1" stop-color="#0A111C"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<path d="M32 88H1168 M32 598H1168" stroke="#1B3042" stroke-width="1"/>
<text x="48" y="48" fill="#8B6CFF" font-size="16" font-family="Arial,sans-serif" letter-spacing="4" font-weight="700">HEMANTH KADIYALA  /  PROJECT VISUAL</text>
<text x="48" y="78" fill="#DCE7F2" font-size="13" font-family="Arial,sans-serif" letter-spacing="2">DARK-EYE</text>
<rect x="40" y="112" width="1120" height="470" rx="14" fill="url(#panel)" stroke="#26394D"/><text x="68" y="150" fill="#EAF4FC" font-size="18" font-weight="700" font-family="Arial,sans-serif">DARK-EYE  /  AGENT EXECUTION PIPELINE</text><rect x="70" y="210" width="170" height="130" rx="12" fill="url(#panel)" stroke="#26394D"/><text x="86" y="238" fill="#00D4FF" font-size="12" font-weight="700" font-family="Arial,sans-serif">01</text><text x="86" y="273" fill="#EAF4FC" font-size="15" font-weight="700" font-family="Arial,sans-serif">USER INPUT</text><text x="86" y="300" fill="#8FA5BA" font-size="11" font-weight="400" font-family="Arial,sans-serif">Prompt / task</text><rect x="292" y="210" width="170" height="130" rx="12" fill="url(#panel)" stroke="#26394D"/><text x="308" y="238" fill="#8B6CFF" font-size="12" font-weight="700" font-family="Arial,sans-serif">02</text><text x="308" y="273" fill="#EAF4FC" font-size="15" font-weight="700" font-family="Arial,sans-serif">PLANNER</text><text x="308" y="300" fill="#8FA5BA" font-size="11" font-weight="400" font-family="Arial,sans-serif">Break down goal</text><rect x="514" y="210" width="170" height="130" rx="12" fill="url(#panel)" stroke="#26394D"/><text x="530" y="238" fill="#F6B94A" font-size="12" font-weight="700" font-family="Arial,sans-serif">03</text><text x="530" y="273" fill="#EAF4FC" font-size="15" font-weight="700" font-family="Arial,sans-serif">TOOL ROUTER</text><text x="530" y="300" fill="#8FA5BA" font-size="11" font-weight="400" font-family="Arial,sans-serif">Select capability</text><rect x="736" y="210" width="170" height="130" rx="12" fill="url(#panel)" stroke="#26394D"/><text x="752" y="238" fill="#54E39A" font-size="12" font-weight="700" font-family="Arial,sans-serif">04</text><text x="752" y="273" fill="#EAF4FC" font-size="15" font-weight="700" font-family="Arial,sans-serif">EXECUTION</text><text x="752" y="300" fill="#8FA5BA" font-size="11" font-weight="400" font-family="Arial,sans-serif">Run bounded tools</text><rect x="958" y="210" width="170" height="130" rx="12" fill="url(#panel)" stroke="#26394D"/><text x="974" y="238" fill="#FF6B9A" font-size="12" font-weight="700" font-family="Arial,sans-serif">05</text><text x="974" y="273" fill="#EAF4FC" font-size="15" font-weight="700" font-family="Arial,sans-serif">OUTPUT</text><text x="974" y="300" fill="#8FA5BA" font-size="11" font-weight="400" font-family="Arial,sans-serif">Result + trace</text><path d="M240 275h42l-10 -7m10 7l-10 7" fill="none" stroke="#4A647B" stroke-width="2"/><path d="M462 275h42l-10 -7m10 7l-10 7" fill="none" stroke="#4A647B" stroke-width="2"/><path d="M684 275h42l-10 -7m10 7l-10 7" fill="none" stroke="#4A647B" stroke-width="2"/><path d="M906 275h42l-10 -7m10 7l-10 7" fill="none" stroke="#4A647B" stroke-width="2"/><rect x="70" y="380" width="490" height="155" rx="14" fill="url(#panel)" stroke="#26394D"/><text x="92" y="412" fill="#AFC3D6" font-size="13" font-weight="700" font-family="Arial,sans-serif">GUARDRAILS &amp; CONTROL</text><text x="100" y="445" fill="#DCE7F2" font-size="12" font-weight="400" font-family="Arial,sans-serif">•  Scoped tool permissions</text><text x="100" y="468" fill="#DCE7F2" font-size="12" font-weight="400" font-family="Arial,sans-serif">•  Input/output validation</text><text x="100" y="491" fill="#DCE7F2" font-size="12" font-weight="400" font-family="Arial,sans-serif">•  Timeouts + error handling</text><text x="100" y="514" fill="#DCE7F2" font-size="12" font-weight="400" font-family="Arial,sans-serif">•  Audit trail for each step</text><rect x="590" y="380" width="526" height="155" rx="14" fill="url(#panel)" stroke="#26394D"/><text x="612" y="412" fill="#AFC3D6" font-size="13" font-weight="700" font-family="Arial,sans-serif">OBSERVABILITY</text><text x="620" y="445" fill="#DCE7F2" font-size="12" font-weight="400" font-family="Arial,sans-serif">•  Run ID  /  task status  /  duration</text><text x="620" y="468" fill="#DCE7F2" font-size="12" font-weight="400" font-family="Arial,sans-serif">•  Tool calls and result summaries</text><text x="620" y="491" fill="#DCE7F2" font-size="12" font-weight="400" font-family="Arial,sans-serif">•  Failure branch + recovery signal</text><text x="620" y="514" fill="#DCE7F2" font-size="12" font-weight="400" font-family="Arial,sans-serif">•  Human review for sensitive actions</text>
<text x="48" y="624" fill="#71869B" font-size="12" font-family="Arial,sans-serif" letter-spacing="2">OBSIDIAN SIGNAL  •  CYBERSECURITY ENGINEERING  •  CONCEPTUAL UI PREVIEW</text>
</svg>